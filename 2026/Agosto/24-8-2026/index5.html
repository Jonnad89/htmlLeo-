<div style="display: flex; gap: 20px;">
    <div>
        <h3>Pendientes</h3>
        <ul id="pendientes">
            <li>Tarea 1 <button onclick="moverTarea(this)">--> </button></li>
            <li>Tarea 2 <button onclick="moverTarea(this)">--> </button></li>
        </ul>
    </div>
    <div>
        <h3>Completadas</h3>
        <ul id="completadas"></ul>
    </div>
</div>

<script>
function moverTarea(btn) {
    const tarea = btn.parentElement;
    const listaPendientes = document.getElementById("pendientes");
    const listaCompletadas = document.getElementById("completadas");

    if (tarea.parentElement.id === "pendientes") {
        listaCompletadas.appendChild(tarea);
        btn.textContent = " <--";
    } else {
        listaPendientes.appendChild(tarea);
        btn.textContent = " -->";
    }
}
</script>
