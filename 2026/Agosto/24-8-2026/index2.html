<button id="btn-theme">Cambiar Tema</button>

<style>
    body { background-color: white; color: black; transition: 0.3s; }
    body.dark-mode { background-color: #121212; color: white; }
</style>

<script>
const btnTheme = document.getElementById("btn-theme");

// 1. Cargar tema guardado al iniciar
if (localStorage.getItem("tema") === "oscuro") {
    document.body.classList.add("dark-mode");
}

// 2. Alternar tema y guardar preferencia
btnTheme.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    
    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("tema", "oscuro");
    } else {
        localStorage.setItem("tema", "claro");
    }
});
</script>
